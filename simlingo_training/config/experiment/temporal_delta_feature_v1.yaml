# @package _global_
defaults:
  - /data_module: carla_bucket_v12_dreamer
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset

model:
  lr: 3e-5
  freeze_language_model: false
  freeze_adaptors: true
  freeze_wp_encoder: true
  predict_route_as_wps: True
  speed_wps_mode: 2d
  language_model:
    variant: 'OpenGVLab/InternVL2-1B'
    lora: True
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    variant: 'OpenGVLab/InternVL2-1B'
    freeze: true
  temporal_model:
    _target_: simlingo_training.models.temporal.delta_feature.TemporalDeltaFeatureEncoder
    enabled: true
    num_queries: 64
    dropout: 0.1
    gate_init: 0.0
    include_absolute_delta: true
    delta_decay: 0.9

data_module:
  batch_size: 12
  num_workers: 8
  base_dataset:
    data_path: database/simlingo
    bucket_path: database/bucketsv2_simlingo
    pred_len: 11
    cut_bottom_quarter: True
    use_commentary: True
    use_qa: True
    qa_augmentation: True
    img_shift_augmentation: True
    img_shift_augmentation_prob: 0.5
    hist_len: 5
    history_stride: 1
    route_as: target_point_command
    use_lmdrive_commands: True
    use_old_towns: True
    use_town13: True
    use_safety_flag: True

max_epochs: 14
val_every_n_epochs: 2

gpus: 8
seed: 9876
name: temporal_delta_feature_v1
resume: False

hydra:
  run:
    dir: outputs/${wandb_name}_${name}
